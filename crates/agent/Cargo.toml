[package]
name = "filar-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Smoke tests that require a real GLM API key (set GLM_API_KEY env var).
smoke = []

[dependencies]
filar-core = { workspace = true }
filar-transport = { workspace = true, features = ["kube"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
# `test-util` (not part of tokio's `full`) gives the fleet fan-out tests a
# paused clock: a per-host deadline can then be proven to fire without a
# test that actually waits 30 seconds (#427).
tokio = { workspace = true, features = ["test-util"] }
# Encrypted test keys for the fleet credential tests (#480).
russh = { workspace = true }
# The risk eval runner reads its dataset (#553).
toml = { workspace = true }
# Live docker/k8s fleet tests manage their explicit pod-deletion fixture (#568).
kube = { workspace = true }
k8s-openapi = { workspace = true }

# Command safety rating eval (#553). `test = true` so its unit tests run
# with `cargo test`; the eval itself only runs when invoked.
[[example]]
name = "risk_eval"
test = true
