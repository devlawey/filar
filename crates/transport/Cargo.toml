[package]
name = "filar-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Local PTY executor and interactive terminal (portable-pty).
# Enabled by default for TUI/desktop; disabled for bot/mobile (SSH-only).
default = ["local", "kube"]
local = ["dep:portable-pty"]
kube = ["dep:kube", "dep:k8s-openapi", "dep:serde", "dep:serde_json", "dep:serde-saphyr", "dep:x509-cert"]

[dependencies]
filar-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
ssh-key = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true, optional = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
dirs = { workspace = true }
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Multi-document YAML manifests for ClusterWriteApi::apply (#638); already in
# the tree through kube-client.
serde-saphyr = { version = "0.0.29", optional = true }
# The public part of a TLS Secret's certificate (#646): subject, SAN, issuer,
# validity. Its der/spki/const-oid are already in the tree.
x509-cert = { version = "0.3", optional = true, default-features = false, features = ["pem"] }

[dev-dependencies]
# Integration tests in `tests/` do not inherit the regular dependencies, and
# `fleet_catalog_readonly.rs` needs both the test runtime and the trait macro.
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
