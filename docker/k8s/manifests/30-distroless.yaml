apiVersion: apps/v1
kind: Deployment
metadata:
  name: distroless
  namespace: shop
  labels:
    app.kubernetes.io/part-of: filar-test-fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distroless
  template:
    metadata:
      labels:
        app: distroless
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      containers:
        # registry.k8s.io/pause contains one static binary and no shell.
        - name: main
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
