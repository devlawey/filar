description: "filar Kubernetes agent eval — diagnostics over ClusterApi and gated writes (#640)"

# The system prompt is synced with build_kube_write_system_prompt (a cluster
# tab with write access) by a Rust test.
prompts:
  - file://prompts/kube-chat.json

maxConcurrency: 1

# Manual mirror of filar_agent::kube_tool_definitions(Always) plus
# kube_write_tool_definitions(Always). No Secret kind is exposed to the
# model for reading.
tools: &kube_tools
  - type: function
    function:
      name: k8s_get
      description: "List Kubernetes resources as a compact table. Pod rows include phase, Ready, restarts, latest termination reason, age and node. Label and field selectors are supported for pods."
      parameters:
        type: object
        properties:
          kind: { type: string, enum: [Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Node, Service, Endpoints, Ingress, ConfigMap, Namespace] }
          namespace: { type: string }
          label_selector: { type: string }
          field_selector: { type: string }
          limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
          explanation: { type: string }
        required: [kind]
        additionalProperties: false
  - type: function
    function:
      name: k8s_describe
      description: "Return a filar-built object summary plus related events. Pod details include last termination and container resource requests/limits; this is not kubectl describe."
      parameters:
        type: object
        properties:
          kind: { type: string, enum: [Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Node, Service, Endpoints, Ingress, ConfigMap, Namespace] }
          namespace: { type: string }
          name: { type: string }
          event_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
          explanation: { type: string }
        required: [kind, name]
        additionalProperties: false
  - type: function
    function:
      name: k8s_logs
      description: "Read bounded, non-following pod logs. Set previous=true after restarts or CrashLoopBackOff to read the previous container instance."
      parameters:
        type: object
        properties:
          namespace: { type: string }
          pod: { type: string }
          container: { type: string }
          previous: { type: boolean, default: false }
          since: { type: string, description: "Duration such as 30m, 2h or 1d." }
          tail: { type: integer, minimum: 1, maximum: 500, default: 100 }
          limit_bytes: { type: integer, minimum: 1, maximum: 1048576, default: 65536 }
          explanation: { type: string }
        required: [pod]
        additionalProperties: false
  - type: function
    function:
      name: k8s_events
      description: "List the latest Kubernetes events, sorted newest first, optionally for one involved object."
      parameters:
        type: object
        properties:
          namespace: { type: string }
          involved_object: { type: string }
          limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
          explanation: { type: string }
        required: []
        additionalProperties: false
  - type: function
    function:
      name: k8s_top
      description: "Read pod or node CPU and memory metrics. If the metrics API is absent, reports that metrics-server is not installed."
      parameters:
        type: object
        properties:
          resource: { type: string, enum: [pods, nodes] }
          namespace: { type: string }
          limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
          explanation: { type: string }
        required: [resource]
        additionalProperties: false
  - type: function
    function:
      name: k8s_rollout_history
      description: "List a Deployment's ReplicaSet-based rollout revisions, newest first."
      parameters:
        type: object
        properties:
          namespace: { type: string }
          deployment: { type: string }
          limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
          explanation: { type: string }
        required: [deployment]
        additionalProperties: false
  - type: function
    function:
      name: k8s_apply
      description: "Create or change Kubernetes objects from a YAML manifest (server-side apply, field manager filar), one or more documents separated by ---. Any kind the user's RBAC allows: Pod, PersistentVolumeClaim, Deployment, Service, ConfigMap, Job, RBAC, custom resources, cluster-scoped objects. Objects without metadata.namespace go to the tab namespace. Every apply is first run as a server dry run and shown to the user as a diff; nothing changes until the user approves. Secret values may be written but are never shown back. A running pod cannot get new volumes or most spec changes: create a new pod or a Deployment. After the apply, check the result by reading (k8s_get, k8s_describe, events)."
      parameters:
        type: object
        properties:
          manifest: { type: string, description: "YAML manifest, one or more documents." }
          explanation: { type: string }
        required: [manifest]
        additionalProperties: false
  - type: function
    function:
      name: k8s_scale
      description: "Set the replicas of a Deployment, StatefulSet or ReplicaSet through its scale subresource. Dry-run first and confirmed by the user, as every write; scaling to 0 stops the workload and is shown as destructive. After the scale filar waits a bounded time for the rollout and reports ready/desired; check events if it is not ready."
      parameters:
        type: object
        properties:
          kind: { type: string, enum: [Deployment, StatefulSet, ReplicaSet] }
          name: { type: string }
          namespace: { type: string, description: "Namespace; omit for the tab namespace." }
          replicas: { type: integer, minimum: 0, maximum: 1000 }
          explanation: { type: string }
        required: [kind, name, replicas]
        additionalProperties: false
  - type: function
    function:
      name: k8s_rollout
      description: "Restart a rollout (Deployment, StatefulSet, DaemonSet: every pod is replaced, as kubectl rollout restart) or undo a Deployment to an earlier revision (its pod template comes back, as kubectl rollout undo). Read k8s_rollout_history before an undo. Dry-run first and confirmed by the user, as every write. After it filar waits a bounded time for the rollout and reports ready/desired; check events if it is not ready."
      parameters:
        type: object
        properties:
          action: { type: string, enum: [restart, undo] }
          kind: { type: string, enum: [Deployment, StatefulSet, DaemonSet], description: "undo works only for Deployment" }
          name: { type: string }
          namespace: { type: string, description: "Namespace; omit for the tab namespace." }
          to_revision: { type: integer, minimum: 1, description: "undo only; omit for the revision before the current one" }
          explanation: { type: string }
        required: [action, kind, name]
        additionalProperties: false
  - type: function
    function:
      name: k8s_delete
      description: "Delete Kubernetes objects of any kind the user's RBAC allows, cluster-scoped ones included (Namespace, Node, PersistentVolume, ClusterRole, CRD) and custom resources: by name or by a label/field selector. The most dangerous write: dry-run first, the user sees what goes with it (a namespace's contents, a CRD's objects, volume data under reclaimPolicy Delete, a node's pods) and confirms. A selector deletes exactly what the dry run listed. A pod managed by a controller is recreated by it. Prefer the smallest delete that solves the problem."
      parameters:
        type: object
        properties:
          kind: { type: string, description: "Kind (Pod), plural (pods) or plural.group (certificates.cert-manager.io)." }
          api_version: { type: string, description: "apiVersion when the kind is ambiguous (cert-manager.io/v1)." }
          name: { type: string, description: "Object name; or give a selector instead." }
          label_selector: { type: string }
          field_selector: { type: string }
          namespace: { type: string, description: "Namespace; omit for the tab namespace." }
          propagation: { type: string, enum: [Background, Foreground, Orphan], default: Background }
          grace_period_seconds: { type: integer, minimum: 0 }
          force: { type: boolean, default: false, description: "gracePeriodSeconds=0: no graceful shutdown." }
          explanation: { type: string }
        required: [kind]
        additionalProperties: false

providers:
  - id: openrouter:z-ai/glm-5.2
    label: GLM-5.2 (OpenRouter)
    config:
      temperature: 0
      max_tokens: 1024
      timeoutMs: 300000
      tools: *kube_tools

tests: file://datasets/kube.yaml
