name: Eval smoke

# Regression smoke for filar's agent eval (methodology §10): runs a 12-case
# smoke subset against one baseline model whenever the system prompt / agent loop /
# dataset changes, and on manual dispatch. Skips (does not fail) on forks or
# repos without the OPENROUTER_API_KEY secret.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'eval/prompts/**'
      - 'crates/agent/src/**'
      - 'eval/datasets/**'
      - 'eval/promptfooconfig.yaml'
      - 'eval/asserts.js'
      # The runner scripts themselves were missing here, so the change that
      # broke the wrapper (#369) never triggered this workflow on its own PR.
      - 'eval/scripts/**'
      - 'eval/asserts.test.js'
      - '.github/workflows/eval-smoke.yml'

permissions:
  contents: read

jobs:
  # Plain-Node unit tests for the eval tooling itself. No secret, no network,
  # so this runs on forks too — and it is the guard that would have caught #369
  # on the day it was introduced, six weeks before anyone noticed.
  unit:
    name: eval script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assert helpers
        run: node eval/asserts.test.js

      - name: run-eval.js wrapper contract
        run: node eval/scripts/run-eval.test.js

  # Secrets cannot be referenced in a job-level `if` (actionlint: the "secrets"
  # context is not allowed there), so a tiny gate job evaluates the secret in its
  # env and exports a boolean. The smoke job then runs only when the secret is
  # present — on forks / repos without it, smoke is skipped, not failed.
  check-secret:
    name: Check for OPENROUTER_API_KEY
    runs-on: ubuntu-latest
    outputs:
      has_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: eval smoke (12 cases, GLM-5.2)
    needs: check-secret
    if: needs.check-secret.outputs.has_secret == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install promptfoo
        # Pinned to the version the smoke set was validated against; bump and
        # re-validate locally before changing.
        run: npm install -g promptfoo@0.121.19

      # Low temperature (0) and throttling are set in promptfooconfig.yaml.
      # PROMPTFOO_BIN uses the globally installed (pinned) version, not npx@latest.
      # NOTE: no `continue-on-error` here. This step used to swallow its own
      # failure, so a wrapper that never started (#369) looked identical to a
      # model that missed the threshold: the run surfaced as "the flakiness
      # retry failed" while the smoke set had not executed at all. A run that
      # cannot produce results must fail loudly and immediately.
      - name: Run smoke subset with retry wrapper
        id: run1
        env:
          PROMPTFOO_BIN: promptfoo
        run: |
          node eval/scripts/run-eval.js --smoke \
            --filter-metadata smoke=true \
            --filter-providers 'glm-5.2' \
            --no-cache \
            -c eval/promptfooconfig.yaml

      - name: Assert results were produced
        if: always()
        run: |
          if [ ! -s eval/results.json ]; then
            echo "::error::eval/results.json is missing or empty — promptfoo produced no results."
            echo "The smoke set did not run. This is not a model regression:"
            echo "check the wrapper invocation and the promptfoo arguments (#369)."
            exit 1
          fi

      - name: Check pass rate (≥ 90%)
        id: check1
        if: always()
        continue-on-error: true
        run: node eval/scripts/smoke-check.js eval/results.json 90

      # One automatic retry of the failed cases (LLMs are non-deterministic);
      # if the retry is still red, the job fails. If the failure is a 429 rate
      # limit, the retry message signals it clearly — rate limits are not
      # regressions.
      - name: Retry failed cases once (flakiness)
        if: steps.check1.outcome == 'failure'
        run: |
          promptfoo eval -c eval/promptfooconfig.yaml \
            --filter-failing eval/results.json \
            --filter-providers 'glm-5.2' \
            --no-cache \
            -o eval/results.retry.json
          node eval/scripts/smoke-check.js eval/results.retry.json 100

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-report
          path: |
            eval/results.json
            eval/results.retry.json
          if-no-files-found: ignore
