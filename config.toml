# filar configuration
# API keys are NOT stored here — enter them in the GUI launcher.

confirm_mode = "allowlist"

# ── LLM ──────────────────────────────────────────────────────────────
# There is no built-in provider: configure any OpenAI-compatible endpoint.
# The `[llm]` section is the fallback used only when no `[[llm_profiles]]`
# are defined; its key is read from FILAR_LLM_API_KEY.
# [llm]
# model = "deepseek-chat"
# api_base_url = "https://api.deepseek.com/v1"
# max_tokens = 4096

# ── LLM profiles ─────────────────────────────────────────────────────
# Named profiles cycled with Ctrl+L in the TUI. A launch starts on the first
# one unless `--llm <name>` picks another. API keys live in the OS credential
# store (or the environment) under the name given by `key_env` — never here.
# An empty `key_env = ""` marks a keyless local model.

# [[llm_profiles]]
# name = "deepseek"
# model = "deepseek-chat"
# api_base_url = "https://api.deepseek.com/v1"
# key_env = "DEEPSEEK_API_KEY"
# max_tokens = 4096
# # Prompt tokens at which the context is considered full. Set it below the
# # model's context window. Reaching it folds the earlier part of the history
# # into a summary and keeps the last turns verbatim. 0 disables automatic
# # compaction; Ctrl+K still compacts on request.
# compact_at_tokens = 200000

[timeouts]
command_secs = 300
# One non-streaming LLM call end to end. While a reply is streaming, this is
# the longest allowed silence between chunks — a long answer is not cut off.
llm_secs = 60
connect_secs = 15

# ── Session export (Ctrl+S) ──────────────────────────────────────────
# An explicit Ctrl+S also writes a runbook next to the .md — the session
# folded into a generalised procedure ({stem}.runbook.md, same folder).
# The call is cancellable with Ctrl+Z and its cost is charged to the
# session. Silent saves (Explain F2, exit) never call the model.
# save_runbook = true

# ── Command safety rating ────────────────────────────────────────────
# A decision model rates every command the agent proposes: 0–100%, where
# 100% = completely safe. Advisory only — it never approves, denies or
# delays a command, and it is separate from the arbiter. No section = off.
# The key lives in the OS credential store (or the environment) under the
# name given by `key_env` — never here; `key_env = ""` = keyless server.
# [risk_scorer]
# kind = "decisions"
# base_url = "https://openrouter.ai/api/alpha"
# model = "typesafe/jev-1.14"
# key_env = "FILAR_RISK_API_KEY"
# timeout_secs = 8              # 1–30
# warn_below = 70               # colour: below — yellow
# danger_below = 40             # colour: below — red
#
# Any OpenAI-compatible chat model can rate commands too, if its server
# returns `logprobs` (llama.cpp server, vLLM and the like): the model answers
# with one digit and the distribution comes from that token's logprobs.
# A server without logprobs gives "unavailable", never a made-up number.
# [risk_scorer]
# kind = "chat-logprobs"
# base_url = "http://127.0.0.1:8080/v1"
# model = "qwen2.5-7b-instruct"
# key_env = ""

# ── SSH targets ──────────────────────────────────────────────────────
# "local" (built-in) = commands run on your machine, no SSH needed.
# Add your servers below. To connect, select the name in the GUI Target dropdown
# or use: filar --target my-server

# Example: password auth (set SSH_PASSWORD env var or it will prompt)
[[ssh_targets]]
name = "test-docker"
host = "127.0.0.1"
port = 2222
user = "testuser"

[ssh_targets.auth]
type = "password"

# ── Kubernetes clusters ────────────────────────────────────────────
# A cluster is a target of its own, in the same name space as SSH targets:
# `context` is mandatory (current-context is never used), credentials stay
# in your kubeconfig — only its path is named here, never its contents.
# [[kube_clusters]]
# name = "prod-eu"
# context = "prod-eu"
# kubeconfig = "~/.kube/config"   # optional; else $KUBECONFIG, then ~/.kube/config
# namespaces = ["shop", "pay"]    # optional: what Ctrl+O offers
# default_namespace = "shop"      # must be listed in namespaces when given
# request_timeout_secs = 20        # 1–120
# tags = ["prod", "k8s"]          # feed [[tag_policies]] exactly like SSH tags
# reveal_configmaps = ["shop/feature-flags"]  # redaction opt-outs, namespace/name
# reveal_env = ["shop/api/PUBLIC_MODE"]       # one literal pod variable; marked in output
# debug_images = ["busybox:1.37"]  # images for an ephemeral debug container (Ctrl+B); empty = off
# diagnostic_ports = [8080, 6060]  # pod ports pod_http_get may reach besides declared ones

# Kubernetes fleet: ready app=web pods frozen on entry in both clusters.
# Use either kube or match = [...] in a host group, never both. Without
# selector, each cluster/namespace pair is itself one fleet member.
# [[host_groups]]
# name = "web-prod"
# kube = { clusters = ["prod-eu", "prod-us"], namespace = "shop", selector = "app=web" }
# max_parallel = 5
# per_host_timeout_secs = 30

# Example: key-based auth
# [[ssh_targets]]
# name = "my-server"
# host = "192.168.1.100"
# port = 22
# user = "admin"
#
# [ssh_targets.auth]
# type = "key"
# path = "~/.ssh/id_ed25519"
