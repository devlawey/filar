# filar configuration
# API keys are NOT stored here — enter them in the GUI launcher.

confirm_mode = "allowlist"

# ── LLM ──────────────────────────────────────────────────────────────
# There is no built-in provider: configure any OpenAI-compatible endpoint.
# The `[llm]` section is the fallback used only when no `[[llm_profiles]]`
# are defined; its key is read from FILAR_LLM_API_KEY.
# [llm]
# model = "deepseek-chat"
# api_base_url = "https://api.deepseek.com/v1"
# max_tokens = 4096

# ── LLM profiles ─────────────────────────────────────────────────────
# Named profiles cycled with Ctrl+L in the TUI. A launch starts on the first
# one unless `--llm <name>` picks another. API keys live in the OS credential
# store (or the environment) under the name given by `key_env` — never here.
# An empty `key_env = ""` marks a keyless local model.

# [[llm_profiles]]
# name = "deepseek"
# model = "deepseek-chat"
# api_base_url = "https://api.deepseek.com/v1"
# key_env = "DEEPSEEK_API_KEY"
# max_tokens = 4096
# # Prompt tokens at which the context is considered full. Set it below the
# # model's context window. Reaching it folds the earlier part of the history
# # into a summary and keeps the last turns verbatim. 0 disables automatic
# # compaction; Ctrl+K still compacts on request.
# compact_at_tokens = 200000

[timeouts]
command_secs = 300
# One non-streaming LLM call end to end. While a reply is streaming, this is
# the longest allowed silence between chunks — a long answer is not cut off.
llm_secs = 60
connect_secs = 15

# ── Session export (Ctrl+S) ──────────────────────────────────────────
# An explicit Ctrl+S also writes a runbook next to the .md — the session
# folded into a generalised procedure ({stem}.runbook.md, same folder).
# The call is cancellable with Ctrl+Z and its cost is charged to the
# session. Silent saves (Explain F2, exit) never call the model.
# save_runbook = true

# ── SSH targets ──────────────────────────────────────────────────────
# "local" (built-in) = commands run on your machine, no SSH needed.
# Add your servers below. To connect, select the name in the GUI Target dropdown
# or use: filar --target my-server

# Example: password auth (set SSH_PASSWORD env var or it will prompt)
[[ssh_targets]]
name = "test-docker"
host = "127.0.0.1"
port = 2222
user = "testuser"

[ssh_targets.auth]
type = "password"

# Example: key-based auth
# [[ssh_targets]]
# name = "my-server"
# host = "192.168.1.100"
# port = 22
# user = "admin"
#
# [ssh_targets.auth]
# type = "key"
# path = "~/.ssh/id_ed25519"
